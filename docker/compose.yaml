services:
  db:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: forum
      POSTGRES_USER: forum
      POSTGRES_PASSWORD: forum_local_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - forum_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forum -d forum"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  forum_postgres_data:
