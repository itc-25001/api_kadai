
services:
  db:
    image: postgres:18.7-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_admin_local_only
      POSTGRES_DB: postgres

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - forum_postgres_data_initdb:/var/lib/postgresql
      - ./initdb.d:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forum -d forum"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  forum_postgres_data_initdb:
